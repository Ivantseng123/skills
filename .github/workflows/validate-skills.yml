name: Validate Skills

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check frontmatter
        run: python3 scripts/check-frontmatter.py
